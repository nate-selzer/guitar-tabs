<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Songbook page: header with capo/key facts, a paper sheet holding the tab, player bar */
  :root {
    --bg: #eef0ec;
    --fg: #1c221f;
    --muted: #5b6660;
    --line: #cfd6d0;
    --accent: #2e6a58;
    --accent-fg: #ffffff;
    --paper: #ffffff;
    --display: "Zilla Slab", Rockwell, "Courier New", serif;
    --body: "Public Sans", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141917; --fg: #e3e8e4; --muted: #94a19a; --line: #2c3531;
      --accent: #6cbfa3; --accent-fg: #0d1512; --paper: #fbfbf8; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141917; --fg: #e3e8e4; --muted: #94a19a; --line: #2c3531;
    --accent: #6cbfa3; --accent-fg: #0d1512; --paper: #fbfbf8; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 20px; }
  header { display: grid; gap: 6px; }
  h1 { font: 700 clamp(26px, 5vw, 40px)/1.1 var(--display); margin: 0; text-wrap: balance; }
  .by { color: var(--muted); font-size: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .fact { font: 500 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; color: var(--muted); }
  .fact b { color: var(--fg); font-weight: 500; }
  .boxes { display: grid; grid-template-columns: repeat(9, 1fr); gap: 18px 10px; padding: 28px 28px 8px; color: #1c221f; }
  @media (max-width: 640px) { .boxes { grid-template-columns: repeat(4, 1fr); padding: 20px 16px 4px; } }
  .boxes figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
  .boxes figcaption { font: 700 15px var(--mono); color: #2e6a58; }
  .boxes svg { width: 100%; max-width: 104px; height: auto; }
  .note { margin: 0; max-width: 68ch; padding: 10px 14px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .views { display: flex; gap: 4px; }
  .views a { font: 600 14px var(--body); color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; }
  .views a[aria-current] { color: var(--fg); border-color: var(--line); }
  .views a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
  button, select { font: 600 14px var(--body); border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); min-width: 92px; }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { color: var(--muted); font-size: 13px; }
  .sheet { background: var(--paper); border-radius: 6px; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); overflow-x: auto; min-height: 320px; }
  .at-cursor-bar { background: rgb(46 106 88 / .08); }
  body:not(.playing) .at-cursor-bar, body:not(.playing) .at-cursor-beat { visibility: hidden; }
  .at-cursor-beat { background: #2e6a58; width: 3px; }
  .at-highlight * { fill: #2e6a58; stroke: #2e6a58; }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <div class="by">__ARTIST__ · tab</div>
    <div class="facts">
      __FACTS__
    </div>
  </header>

  __NOTE__

  <nav class="views"><a href="./" aria-current="page">Tab</a><a href="chords.html">Chords</a></nav>

  <div class="bar">
    <button id="play" class="primary" disabled>Loading…</button>
    <button id="stop" disabled>Stop</button>
    <label for="speed" class="status">Speed</label>
    <select id="speed">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
    </select>
    <label for="sound" class="status">Sound</label>
    <select id="sound" title="Higher-quality soundfonts download when picked">
      <option value="basic">Basic</option>
      <option value="gugs">GeneralUser GS (32 MB)</option>
      <option value="fluid">FluidR3 (24 MB)</option>
    </select>
    <span id="status" class="status"></span>
  </div>

  <div class="sheet">
    <div class="boxes">__DIAGRAMS__</div>
    <div id="tab"></div>
  </div>

</div>

<script type="text/plain" id="tex">__TEX__</script>
<script src="../vendor/alphatab/alphaTab.min.js"></script>
<script>
  const el = document.getElementById('tab');
  const playBtn = document.getElementById('play');
  const stopBtn = document.getElementById('stop');
  const status = document.getElementById('status');
  const narrow = matchMedia('(max-width: 640px)').matches;

  const api = new alphaTab.AlphaTabApi(el, {
    core: {
      fontDirectory: new URL('../vendor/alphatab/font/', location.href).href,
      scriptFile: new URL('../vendor/alphatab/alphaTab.min.js', location.href).href,
      enableLazyLoading: false,
      useWorkers: false,
    },
    display: {
      staveProfile: 'Tab',
      scale: narrow ? 0.8 : 1,
      barsPerRow: narrow ? 2 : 3,
      justifyLastSystem: true,
      systemPaddingBottom: 40,
      padding: [24, 24, 24, 24],
      resources: { effectFont: '600 12px "Public Sans", Arial, sans-serif' },
    },
    notation: {
      elements: {
        scoreTitle: false, scoreArtist: false, scoreSubTitle: false,
        guitarTuning: false, trackNames: false, effectDynamics: false, effectTempo: false,
        effectCapo: false, effectLetRing: false, chordDiagrams: false, effectChordNames: false, barNumber: false,
      },
    },
    player: {
      enablePlayer: true,
      enableCursor: true,
      enableUserInteraction: true,
      scrollElement: document.scrollingElement,
    },
  });

  // Let-ring sustains up to a bar; cap it so chords don't blur, except the final chord and `free` [start, end) tick ranges.
  function capRing(midi, maxTicks, free = []) {
    for (const track of midi.tracks) {
      const open = new Map();
      const lastOn = Math.max(...track.events.filter(e => e.type === 128).map(e => e.tick));
      for (const e of track.events) {
        const key = `${e.channel}:${e.noteKey}`;
        // alphaTab's event types: 128 = note on, 144 = note off (class names are minified in the browser build).
        if (e.type === 128 && e.noteVelocity > 0 && e.tick < lastOn && !free.some(([a, b]) => e.tick >= a && e.tick < b)) open.set(key, e.tick);
        else if ((e.type === 144 || e.type === 128) && open.has(key)) {
          e.tick = Math.min(e.tick, open.get(key) + maxTicks);
          open.delete(key);
        }
      }
      track.events.sort((a, b) => a.tick - b.tick);
    }
  }
  // Seeded variations so playback sounds played, not sequenced: beat accents, volume and timing nudges, spread chords.
  function humanize(midi) {
    let seed = 1;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1;
    for (const track of midi.tracks) {
      // Grace notes are short and start off the sixteenth-note grid (240 ticks); find them before shifting anything.
      const grace = new Set();
      const started = new Map();
      for (const e of track.events) {
        const key = `${e.channel}:${e.noteKey}`;
        if (e.type === 128 && e.noteVelocity > 0) started.set(key, e);
        else if ((e.type === 144 || e.type === 128) && started.has(key)) {
          const on = started.get(key);
          if (e.tick - on.tick < 200 && on.tick % 240 !== 0) grace.add(on);
          started.delete(key);
        }
      }
      const shift = new Map();
      for (const e of track.events) {
        const key = `${e.channel}:${e.noteKey}`;
        if (e.type === 128 && e.noteVelocity > 0) {
          const onBeat = e.tick % 960 === 0;
          // Already-quiet notes (mutes) stay quiet.
          const base = grace.has(e) ? 35 : e.noteVelocity < 30 ? e.noteVelocity : e.noteVelocity + (onBeat ? 8 : -6);
          e.noteVelocity = Math.max(1, Math.min(127, Math.round(base + rand() * 6)));
          const d = Math.round(rand() * 8);
          shift.set(key, d);
          e.tick = Math.max(0, e.tick + d);
        } else if ((e.type === 144 || e.type === 128) && shift.has(key)) {
          e.tick = Math.max(0, e.tick + shift.get(key));
          shift.delete(key);
        }
      }
      track.events.sort((a, b) => a.tick - b.tick);
    }
  }
  // Muted (x) notes play at the softest dynamic, so they mostly just stop the string rather than thump.
  function quietMutes(score) {
    for (const track of score.tracks) for (const staff of track.staves) for (const bar of staff.bars)
      for (const voice of bar.voices) for (const beat of voice.beats) for (const note of beat.notes) if (note.isDead) note.dynamics = 0;
  }
  // Playback uses the strummed (brushed) score; the drawn copy drops the strum markers so the tab has no arrows.
  const tex = document.getElementById('tex').textContent.trim();
  const strummed = new alphaTab.midi.MidiFile();
  const importer = new alphaTab.importer.AlphaTexImporter();
  importer.initFromString(tex, api.settings);
  const strumScore = importer.readScore();
  quietMutes(strumScore);
  const generator = new alphaTab.midi.MidiFileGenerator(strumScore, api.settings, new alphaTab.midi.AlphaSynthMidiFileHandler(strummed));
  generator.generate();
  const freeRingBars = __FREE_RING__;
  const freeRing = generator.tickLookup.masterBars.filter(m => freeRingBars.includes(m.masterBar.index)).map(m => [m.start, m.end]);
  api.scoreLoaded.on(score => {
    for (const track of score.tracks) for (const staff of track.staves) for (const bar of staff.bars)
      for (const voice of bar.voices) for (const beat of voice.beats) beat.brushType = 0;
  });
  capRing(strummed, __RING__ * 960, freeRing);
  humanize(strummed);
  api.midiLoad.on(midi => { midi.tracks = strummed.tracks; });
  api.tex(tex);

  // Basic soundfont by default; the Sound menu downloads a larger one on demand and remembers the pick per browser.
  const SOUNDS = {
    gugs: ['../vendor/soundfont-hq/GeneralUser-GS.sf2', 'GeneralUser GS'],
    fluid: ['../vendor/soundfont-fluid/FluidR3Mono_GM.sf3', 'FluidR3'],
  };
  const soundSelect = document.getElementById('sound');
  async function fetchWithProgress(url, label) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const total = Number(res.headers.get('content-length')) || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    for (let r; !(r = await reader.read()).done;) {
      chunks.push(r.value);
      loaded += r.value.length;
      if (total) status.textContent = `Downloading ${label} ${Math.floor((loaded / total) * 100)}%`;
    }
    const bytes = new Uint8Array(loaded);
    let offset = 0;
    for (const c of chunks) { bytes.set(c, offset); offset += c.length; }
    return bytes;
  }
  async function loadSound(name) {
    soundSelect.disabled = true;
    try {
      const bytes = SOUNDS[name]
        ? await fetchWithProgress(...SOUNDS[name])
        : Uint8Array.from(atob((await (await fetch('../vendor/alphatab/soundfont/sonivox.sf2.b64.txt')).text()).trim()), c => c.charCodeAt(0));
      status.textContent = 'Loading sounds…';
      api.loadSoundFont(bytes, false);
      soundSelect.value = name;
      try { localStorage.setItem('guitar-tabs:sound', name); } catch {}
    } catch (e) {
      status.textContent = 'Could not load sounds: ' + e.message;
    } finally {
      soundSelect.disabled = false;
    }
  }
  soundSelect.addEventListener('change', () => loadSound(soundSelect.value));
  let startSound = 'basic';
  try { startSound = localStorage.getItem('guitar-tabs:sound') || (localStorage.getItem('guitar-tabs:hq') === '1' ? 'gugs' : 'basic'); } catch {}
  status.textContent = 'Loading sounds…';
  loadSound(SOUNDS[startSound] ? startSound : 'basic');

  api.soundFontLoad.on(e => {
    status.textContent = 'Loading sounds ' + Math.floor((e.loaded / e.total) * 100) + '%';
  });
  api.playerReady.on(() => {
    playBtn.disabled = false;
    stopBtn.disabled = false;
    playBtn.textContent = 'Play';
    status.textContent = '';
  });
  api.playerStateChanged.on(e => {
    playBtn.textContent = e.state === 1 ? 'Pause' : 'Play';
    document.body.classList.toggle('playing', e.state === 1);
  });
  api.error.on(e => { status.textContent = 'Could not load: ' + (e?.message || e); });

  playBtn.addEventListener('click', () => api.playPause());
  stopBtn.addEventListener('click', () => api.stop());
  document.getElementById('speed').addEventListener('change', e => { api.playbackSpeed = Number(e.target.value); });
</script>
