<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Songbook page: header with capo/key facts, a paper sheet holding the tab, player bar */
  :root {
    --bg: #eef0ec;
    --fg: #1c221f;
    --muted: #5b6660;
    --line: #cfd6d0;
    --accent: #2e6a58;
    --accent-fg: #ffffff;
    --paper: #ffffff;
    --display: "Zilla Slab", Rockwell, "Courier New", serif;
    --body: "Public Sans", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141917; --fg: #e3e8e4; --muted: #94a19a; --line: #2c3531;
      --accent: #6cbfa3; --accent-fg: #0d1512; --paper: #fbfbf8; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141917; --fg: #e3e8e4; --muted: #94a19a; --line: #2c3531;
    --accent: #6cbfa3; --accent-fg: #0d1512; --paper: #fbfbf8; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 20px; }
  header { display: grid; gap: 6px; }
  h1 { font: 700 clamp(26px, 5vw, 40px)/1.1 var(--display); margin: 0; text-wrap: balance; }
  .by { color: var(--muted); font-size: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .fact { font: 500 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; color: var(--muted); }
  .fact b { color: var(--fg); font-weight: 500; }
  /* Every chord box is the same size; the column count adapts to the width (9 per row on desktop). */
  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 18px 10px; padding: 28px 28px 8px; color: #1c221f; }
  @media (max-width: 640px) { .boxes { padding: 20px 16px 4px; } }
  .boxes figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
  .boxes figcaption { font: 700 13px var(--mono); color: #2e6a58; white-space: nowrap; }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font: 600 13px var(--body); }
  /* Below this width alphaTab packs bars so tightly that lyrics collide; the sheet scrolls sideways instead. */
  #tab { min-width: 760px; }
  .boxes svg { width: 84px; height: auto; }
  .note { margin: 0; max-width: 68ch; padding: 10px 14px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .views { display: flex; gap: 4px; }
  .views a { font: 600 14px var(--body); color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; }
  .views a[aria-current] { color: var(--fg); border-color: var(--line); }
  .views .source { margin-left: auto; }
  .views a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
  button, select { font: 600 14px var(--body); border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); min-width: 92px; }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { color: var(--muted); font-size: 13px; }
  .sheet { background: var(--paper); border-radius: 6px; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); overflow-x: auto; min-height: 320px; }
  .at-cursor-bar { background: rgb(46 106 88 / .08); }
  body:not(.playing) .at-cursor-bar, body:not(.playing) .at-cursor-beat { visibility: hidden; }
  .at-cursor-beat { background: #2e6a58; width: 3px; }
  .at-highlight * { fill: #2e6a58; stroke: #2e6a58; }
  @media print {
    :root { --bg: #fff; --fg: #1c221f; }
    body { background: #fff; }
    .bar, .views { display: none; }
    .wrap { padding-block: 0; }
    .sheet { box-shadow: none; overflow: visible; }
    #tab { min-width: 0; }
    .boxes { break-inside: avoid; }
    /* alphaTab places each tab row absolutely; put rows back in flow so a page break moves whole rows. */
    #tab .at-surface { height: auto !important; padding-top: 24px; }
    #tab .at-surface > div { position: relative !important; top: auto !important; display: block !important; break-inside: avoid; }
  }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <div class="by">__ARTIST__ · tab</div>
    <div class="facts">
      __FACTS__
    </div>
  </header>
  <nav class="views"><a href="./" aria-current="page">Tab</a><a href="chords.html">Chords</a><a class="source" href="https://github.com/nate-selzer/guitar-tabs/tree/main/__SLUG__">GitHub</a></nav>

  __NOTE__


  <div class="bar">
    <button id="play" class="primary" disabled>Loading…</button>
    <button id="stop" disabled>Stop</button>
    <label class="field"><span>Speed</span>
      <select id="speed">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
      </select>
    </label>
    <label class="field"><span>Sound</span>
      <select id="sound" title="Higher-quality soundfonts download when picked">
        <option value="basic">Basic</option>
        <option value="gugs">GeneralUser GS (32 MB)</option>
        <option value="fluid">FluidR3 (24 MB)</option>
      </select>
    </label>
    <button id="print">Print</button>
    <span id="status" class="status"></span>
  </div>

  <div class="sheet">
    <div class="boxes">__DIAGRAMS__</div>
    <div id="tab"></div>
  </div>

</div>

<script type="text/plain" id="tex">__TEX__</script>
__SCRIPTS__
<script>
  const el = document.getElementById('tab');
  const playBtn = document.getElementById('play');
  const stopBtn = document.getElementById('stop');
  const status = document.getElementById('status');
  const narrow = matchMedia('(max-width: 640px)').matches;
  // Only in the chat version of the page: the song's bars and chord charts, so edits can be tried here and copied back to Claude.
  const EDIT = __EDIT__;

  const api = GT.newApi(el, {
    display: {
      staveProfile: 'Tab',
      scale: narrow ? 0.8 : 1,
      barsPerRow: narrow ? 2 : 3,
      justifyLastSystem: true,
      systemPaddingBottom: 40,
      padding: [24, 24, 24, 24],
      resources: { effectFont: '600 12px "Public Sans", Arial, sans-serif' },
    },
    notation: {
      elements: {
        scoreTitle: false, scoreArtist: false, scoreSubTitle: false,
        guitarTuning: false, trackNames: false, effectDynamics: false, effectTempo: false,
        effectCapo: false, effectLetRing: false, chordDiagrams: false, effectChordNames: false, barNumber: false,
      },
    },
    player: {
      enablePlayer: true,
      enableCursor: true,
      enableUserInteraction: true,
      scrollElement: document.scrollingElement,
    },
  });

  // Playback uses the strummed (brushed) score; the drawn copy drops strum (brush) markers so the tab has no arrows; rolled chords (arpeggios) keep theirs.
  const ring = __RING__;
  const letRingBars = __FREE_RING__;
  let midi;
  api.scoreLoaded.on(score => {
    for (const track of score.tracks) for (const staff of track.staves) for (const bar of staff.bars)
      for (const voice of bar.voices) for (const beat of voice.beats) if (beat.brushType === 1 || beat.brushType === 2) beat.brushType = 0;
  });
  api.midiLoad.on(m => { m.tracks = midi.tracks; });
  function show(tex) {
    midi = GT.strummedMidi(tex, api.settings, ring, letRingBars);
    api.tex(tex);
  }
  show(document.getElementById('tex').textContent.trim());

  // Basic soundfont by default; the Sound menu downloads a larger one on demand and remembers the pick per browser.
  const soundSelect = document.getElementById('sound');
  for (const option of [...soundSelect.options]) if (option.value !== 'basic' && !GT.sounds[option.value]) option.remove();
  soundSelect.closest('.field').hidden = soundSelect.options.length < 2;
  async function loadSound(name) {
    soundSelect.disabled = true;
    try {
      const bytes = await GT.soundBytes(name, text => { status.textContent = text; });
      status.textContent = 'Loading sounds…';
      api.loadSoundFont(bytes, false);
      soundSelect.value = name;
      GT.saveSound(name);
    } catch (e) {
      status.textContent = 'Could not load sounds: ' + e.message;
    } finally {
      soundSelect.disabled = false;
    }
  }
  soundSelect.addEventListener('change', () => loadSound(soundSelect.value));
  status.textContent = 'Loading sounds…';
  loadSound(GT.savedSound());

  api.soundFontLoad.on(e => {
    status.textContent = 'Loading sounds ' + Math.floor((e.loaded / e.total) * 100) + '%';
  });
  api.playerReady.on(() => {
    playBtn.disabled = false;
    stopBtn.disabled = false;
    playBtn.textContent = 'Play';
    status.textContent = '';
  });
  api.playerStateChanged.on(e => {
    playBtn.textContent = e.state === 1 ? 'Pause' : 'Play';
    document.body.classList.toggle('playing', e.state === 1);
  });
  api.error.on(e => { status.textContent = 'Could not load: ' + (e?.message || e); });

  playBtn.addEventListener('click', () => api.playPause());
  document.getElementById('print').addEventListener('click', () => window.print());
  stopBtn.addEventListener('click', () => api.stop());
  document.getElementById('speed').addEventListener('change', e => { api.playbackSpeed = Number(e.target.value); });

  // Chat page: edits stay in this browser until copied into the chat, where Claude applies them to song.mjs and rebuilds.
  if (EDIT) {
    document.querySelector('.views').remove();
    const key = `guitar-tabs:edits:${EDIT.slug}`;
    const chartKey = `guitar-tabs:charts:${EDIT.slug}`;
    let pending = {};
    let pendingCharts = {};
    try { pending = JSON.parse(localStorage.getItem(key)) ?? {}; pendingCharts = JSON.parse(localStorage.getItem(chartKey)) ?? {}; } catch {}
    // Edits that this build already has are done.
    for (const [i, tex] of Object.entries(pending)) if (tex === (EDIT.bars[i]?.override ?? null)) delete pending[i];
    for (const [name, fields] of Object.entries(pendingCharts)) {
      const built = EDIT.chords[name];
      const same = fields === null ? !built?.edited : built?.edited && Object.keys(fields).every(k => JSON.stringify(fields[k]) === JSON.stringify(built.shape[k] ?? null));
      if (!built || same) delete pendingCharts[name];
    }
    const chartOf = name => (name in pendingCharts ? { ...EDIT.chords[name].base, ...pendingCharts[name] } : EDIT.chords[name].shape);
    const boxes = document.querySelector('.boxes');
    const drawChart = name => {
      const fig = boxes.querySelector(`figure[data-chord="${CSS.escape(name)}"]`);
      const shape = chartOf(name);
      fig.querySelector('figcaption').textContent = shape.name ?? name;
      fig.querySelector('svg').outerHTML = chordChart.svg(shape.name ?? name, shape);
    };
    for (const name in pendingCharts) drawChart(name);
    const texWithEdits = () => EDIT.head + '\n' + EDIT.bars.map((b, i) =>
      [b.head, i in pending ? pending[i] ?? b.pattern : b.override ?? b.pattern].filter(Boolean).join(' ')).join(' |\n');
    if (Object.keys(pending).length) show(texWithEdits());

    const editBtn = Object.assign(document.createElement('button'), { textContent: 'Edit' });
    editBtn.setAttribute('aria-pressed', 'false');
    const copyBtn = Object.assign(document.createElement('button'), { className: 'primary' });
    const copyBox = Object.assign(document.createElement('textarea'), { readOnly: true, hidden: true, rows: 3 });
    copyBox.setAttribute('aria-label', 'Edits to paste into the chat');
    copyBox.style.cssText = 'width: 100%; font: 12px var(--mono);';
    document.getElementById('print').before(editBtn, copyBtn);
    document.querySelector('.bar').after(copyBox);
    const changed = () => {
      try { localStorage.setItem(key, JSON.stringify(pending)); localStorage.setItem(chartKey, JSON.stringify(pendingCharts)); } catch {}
      const n = Object.keys(pending).length + Object.keys(pendingCharts).length;
      copyBtn.textContent = `Copy ${n} edit${n === 1 ? '' : 's'} for Claude`;
      copyBtn.hidden = !n;
      copyBox.hidden = true;
    };
    changed();

    let editing = false;
    const editor = GT.mountEditor(api, {
      header: () => EDIT.head + '\n',
      ringBeats: () => ring,
      letRingBars: () => letRingBars,
      enabled: () => editing,
      saveLabel: 'Keep edit',
      onSave: (i, raw) => {
        pending[i] = raw;
        changed();
        show(texWithEdits());
        return 'Kept. Use Copy edits to send your edits to Claude.';
      },
      onReset: i => {
        if (EDIT.bars[i].override) pending[i] = null;
        else delete pending[i];
        changed();
        show(texWithEdits());
        return 'Back to the song pattern.';
      },
    });
    GT.mountChartEditor(boxes, {
      chart: chartOf,
      playTex: editor.playTex,
      saveLabel: 'Keep chart',
      onSave: (name, fields) => {
        pendingCharts[name] = fields;
        changed();
        drawChart(name);
        return 'Kept. Fret changes reach the tab once Claude applies your edits.';
      },
      onReset: name => {
        if (EDIT.chords[name].edited) pendingCharts[name] = null;
        else delete pendingCharts[name];
        changed();
        drawChart(name);
        return 'Back to the song\'s shape.';
      },
    });
    editBtn.addEventListener('click', () => {
      editing = !editing;
      editBtn.setAttribute('aria-pressed', String(editing));
      editBtn.textContent = editing ? 'Done editing' : 'Edit';
      boxes.toggleAttribute('data-editing', editing);
      status.textContent = editing ? 'Click a chord chart or a bar to edit it.' : '';
      if (!editing) { editor.close(); document.dispatchEvent(new CustomEvent('gt-panel')); }
    });
    copyBtn.addEventListener('click', async () => {
      const text = `Apply my edits to ${EDIT.slug}:\n${JSON.stringify({ song: EDIT.slug, edits: pending, chords: pendingCharts })}`;
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = 'Copied. Paste it into the chat.';
      } catch {
        copyBox.value = text;
        copyBox.hidden = false;
        copyBox.select();
        status.textContent = 'Copy the selected text and paste it into the chat.';
      }
    });
  }
</script>
