<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ Chords</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Chord sheet: header, chord boxes, then chords-over-lyrics sections */
  :root {
    --bg: #eef0ec;
    --fg: #1c221f;
    --muted: #5b6660;
    --line: #cfd6d0;
    --accent: #2e6a58;
    --display: "Zilla Slab", Rockwell, "Courier New", serif;
    --body: "Public Sans", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141917; --fg: #e3e8e4; --muted: #94a19a; --line: #2c3531; --accent: #6cbfa3; --thumb-text: #141917; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 24px; }
  header { display: grid; gap: 6px; }
  h1 { font: 700 clamp(26px, 5vw, 40px)/1.1 var(--display); margin: 0; text-wrap: balance; }
  .by { color: var(--muted); font-size: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .fact { font: 500 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; color: var(--muted); }
  .fact b { color: var(--fg); font-weight: 500; }
  .note { margin: 0; max-width: 68ch; padding: 10px 14px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .views { display: flex; gap: 4px; }
  .views a { font: 600 14px var(--body); color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; }
  .views a[aria-current] { color: var(--fg); border-color: var(--line); }
  .views a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .boxes { display: flex; flex-wrap: wrap; gap: 12px 18px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 2px; }
  figcaption { font: 700 13px var(--mono); color: var(--accent); }
  figure svg { width: 72px; height: auto; color: var(--fg); }
  .sheet { display: grid; gap: 22px; overflow-x: auto; }
  section h2 { font: 700 15px var(--mono); color: var(--muted); margin: 0 0 6px; }
  pre { margin: 0; font: 500 15px/1.45 var(--mono); }
  pre b { color: var(--accent); font-weight: 700; }
  pre i { color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <div class="by">__ARTIST__ · chords</div>
    <div class="facts">
      __FACTS__
    </div>
  </header>

  __NOTE__

  <nav class="views"><a href="./">Tab</a><a href="chords.html" aria-current="page">Chords</a></nav>

  <div class="boxes">__DIAGRAMS__</div>

  <div class="sheet">__SHEET__</div>
</div>
