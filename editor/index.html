<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Local bar editor: full tab on top, a fixed panel at the bottom with the selected bar as a string x sixteenth grid */
  :root {
    --bg: #eef0ec; --fg: #1c221f; --muted: #5b6660; --line: #cfd6d0; --accent: #2e6a58; --paper: #fff; --bad: #b3261e;
    --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); padding-bottom: 340px; }
  header { padding: 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .hint { color: var(--muted); }
  .sheet { background: var(--paper); margin: 0 16px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); overflow-x: auto; }
  #tab .at-cursor-bar { background: rgb(46 106 88 / .12); }
  #panel { position: fixed; z-index: 2000; inset: auto 0 0 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px 16px; display: grid; gap: 10px; max-height: 330px; overflow: auto; }
  #panel[hidden] { display: none !important; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: 600 13px var(--body); border-radius: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #status { color: var(--muted); white-space: pre-wrap; }
  #status.bad { color: var(--bad); }
  .grid-wrap { overflow-x: auto; }
  table { border-collapse: collapse; font: 500 13px var(--mono); }
  th { font-weight: 500; color: var(--muted); padding: 0 1px; text-align: center; min-width: 34px; }
  th.beat { color: var(--fg); font-weight: 700; }
  th.str { text-align: right; padding-right: 6px; }
  td { padding: 1px; }
  td.down { border-left: 1px solid var(--line); }
  .marker { font: 400 11px var(--body); color: var(--accent); white-space: nowrap; max-width: 34px; overflow: visible; text-align: left; }
  input { width: 30px; box-sizing: border-box; text-align: center; font: 600 13px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 3px 0; background: var(--paper); color: var(--fg); }
  input.bad { border-color: var(--bad); color: var(--bad); }
  input:not(:placeholder-shown) { background: #e3efe9; }
</style>

<header>
  <h1 id="title">Tab editor</h1>
  <span class="hint">Click a bar to edit it.</span>
</header>
<div class="sheet"><div id="tab"></div></div>

<section id="panel" hidden>
  <div class="row">
    <b id="bar-label"></b>
    <button id="play">Play bar</button>
    <button id="save" class="primary">Save &amp; rebuild</button>
    <button id="reset">Reset to pattern</button>
    <span id="status"></span>
  </div>
  <div class="hint">Type a fret in a cell; clear it to remove the note. Add <b>h</b> after the fret (e.g. <b>0h</b>) to hammer on or pull off to the next note on that string. A note rings until the next note in the bar.</div>
  <div class="grid-wrap"><table id="grid"></table></div>
</section>

<script src="/vendor/alphatab/alphaTab.min.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('song');
  const STRINGS = ['e', 'B', 'G', 'D', 'A', 'E']; // top row = alphaTex string 1
  const LENGTHS = [[16, '.1', false], [12, '.2', true], [8, '.2', false], [6, '.4', true], [4, '.4', false], [3, '.8', true], [2, '.8', false], [1, '.16', false]];
  const $ = id => document.getElementById(id);
  const status = (text, bad = false) => { $('status').textContent = text; $('status').classList.toggle('bad', bad); };
  let selected = null; // { index, length, markers }

  const api = new alphaTab.AlphaTabApi($('tab'), {
    core: { fontDirectory: new URL('/vendor/alphatab/font/', location.href).href, scriptFile: new URL('/vendor/alphatab/alphaTab.min.js', location.href).href, useWorkers: false, enableLazyLoading: false },
    display: { staveProfile: 'Tab', barsPerRow: innerWidth < 900 ? 2 : 3, justifyLastSystem: true, systemPaddingBottom: 40 },
    notation: { elements: { scoreTitle: false, scoreArtist: false, guitarTuning: false, trackNames: false, effectDynamics: false, effectTempo: false, effectCapo: false, effectLetRing: false, chordDiagrams: false, effectChordNames: false } },
  });
  // Play bar renders the grid's current contents into a hidden one-bar score, so unsaved edits can be heard.
  const previewEl = Object.assign(document.createElement('div'), { style: 'position:absolute; left:-10000px; width:900px' });
  document.body.append(previewEl);
  const preview = new alphaTab.AlphaTabApi(previewEl, {
    core: { fontDirectory: new URL('/vendor/alphatab/font/', location.href).href, scriptFile: new URL('/vendor/alphatab/alphaTab.min.js', location.href).href, useWorkers: false, enableLazyLoading: false },
    display: { staveProfile: 'Tab' },
    player: { enablePlayer: true, enableCursor: false },
  });
  // alphaTab only creates the player once a score is loaded, so the soundfont goes in after the first one.
  const soundFont = fetch('/vendor/alphatab/soundfont/sonivox.sf2.b64.txt').then(r => r.text())
    .then(b64 => Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0)));
  preview.scoreLoaded.on(function first() { preview.scoreLoaded.off(first); soundFont.then(bytes => preview.loadSoundFont(bytes)); });
  let header = '';

  async function load() {
    if (!slug) return status('Add ?song=<folder> to the URL.', true);
    const tex = await (await fetch(`/${slug}/song.tex`, { cache: 'no-store' })).text();
    header = tex.slice(0, tex.indexOf('\\ts'));
    $('title').textContent = tex.match(/\\title "(.*)"/)?.[1] ?? slug;
    api.tex(tex);
  }
  api.scoreLoaded.on(() => { if (selected) select(selected.index); });
  api.beatMouseDown.on(beat => select(beat.voice.bar.index));

  // Reads one bar of the loaded score into the grid: cells[row][sixteenth] = "fret" or "fret" + "h".
  function select(index) {
    const masterBar = api.score.masterBars[index];
    const bar = api.score.tracks[0].staves[0].bars[index];
    const length = Math.round(masterBar.calculateDuration() / 240);
    const cells = STRINGS.map(() => Array(length).fill(''));
    const markers = {};
    for (const beat of bar.voices[0].beats) {
      const pos = Math.round(beat.playbackStart / 240);
      for (const note of beat.notes) cells[6 - note.string][pos] = `${note.fret}${note.isHammerPullOrigin ? 'h' : ''}`;
      if (beat.chord || beat.lyrics?.some(Boolean)) markers[pos] = { chord: beat.chord?.name, lyrics: beat.lyrics ?? [] };
    }
    selected = { index, length, markers };
    $('bar-label').textContent = `Bar ${index + 1}`;
    renderGrid(cells);
    $('panel').hidden = false;
    status('');
  }

  function renderGrid(cells) {
    const { length, markers } = selected;
    const counts = ['', 'e', '&', 'a'];
    const head = Array.from({ length }, (_, i) => `<th class="${i % 4 ? '' : 'beat'}">${i % 4 ? counts[i % 4] : i / 4 + 1}</th>`).join('');
    const marks = Array.from({ length }, (_, i) => {
      const m = markers[i];
      return `<th class="marker" title="${m ? [m.chord, ...m.lyrics].filter(Boolean).join(' / ') : ''}">${m ? (m.chord ?? '') + (m.lyrics.find(Boolean) ? ` “${m.lyrics.find(Boolean)}”` : '') : ''}</th>`;
    }).join('');
    const rows = STRINGS.map((name, r) => `<tr><th class="str">${name}</th>${cells[r].map((v, i) =>
      `<td class="${i % 4 ? '' : 'down'}"><input id="c-${r}-${i}" value="${v}" placeholder=" " aria-label="${name} string, sixteenth ${i + 1}"></td>`).join('')}</tr>`).join('');
    $('grid').innerHTML = `<tr><th></th>${marks}</tr><tr><th></th>${head}</tr>${rows}`;
  }

  // Turns the grid back into alphaTex: one beat per onset, lasting until the next onset, padded with rests.
  function gridToTex() {
    const { length, markers } = selected;
    const notes = Array.from({ length }, () => []);
    let ok = true;
    for (let r = 0; r < 6; r++) for (let i = 0; i < length; i++) {
      const input = $(`c-${r}-${i}`);
      const m = input.value.trim().match(/^(\d{1,2})(h?)$/i);
      input.classList.toggle('bad', !!input.value.trim() && !m);
      if (input.value.trim() && !m) ok = false;
      if (m) notes[i].push(`${m[1]}.${r + 1}{lr${m[2] ? ' h' : ''}}`);
    }
    if (!ok) return null;
    const onsets = [...new Set([0, ...notes.flatMap((n, i) => (n.length ? [i] : [])), ...Object.keys(markers).map(Number)])].sort((a, b) => a - b);
    const out = [];
    onsets.forEach((pos, k) => {
      let gap = (onsets[k + 1] ?? length) - pos;
      let first = true;
      while (gap > 0) {
        const [len, dur, dotted] = LENGTHS.find(([l]) => l <= gap);
        const m = first ? markers[pos] : null;
        const fx = [dotted && 'd', m?.chord && `ch "${m.chord}"`, ...(m?.lyrics ?? []).map((t, i) => t && `lyrics ${i} "${t.replace(/"/g, '\\"')}"`)].filter(Boolean);
        const body = first && notes[pos].length ? (notes[pos].length > 1 ? `(${notes[pos].join(' ')})` : notes[pos][0]) : 'r';
        out.push(`${body}${dur}${fx.length ? ` {${fx.join(' ')}}` : ''}`);
        gap -= len;
        first = false;
      }
    });
    return out.join(' ');
  }

  async function change(method, body) {
    status('Rebuilding…');
    const res = await fetch(`/api/${slug}/bars/${selected.index}`, { method, body: body && JSON.stringify(body) });
    const text = await res.text();
    if (!res.ok) return status(text || `Save failed (${res.status})`, true);
    await load();
    status(method === 'PUT' ? 'Saved.' : 'Reset to the song pattern.');
  }

  $('save').addEventListener('click', () => {
    const raw = gridToTex();
    if (raw === null) return status('Fix the red cells: use a fret number, optionally followed by h.', true);
    change('PUT', { raw });
  });
  $('reset').addEventListener('click', () => change('DELETE'));
  $('play').addEventListener('click', () => {
    if (preview.playerState === 1) return preview.stop();
    const raw = gridToTex();
    if (raw === null) return status('Fix the red cells: use a fret number, optionally followed by h.', true);
    const ts = api.score.masterBars[selected.index];
    const start = () => { preview.isLooping = true; preview.play(); };
    preview.midiLoaded.on(function loaded() {
      preview.midiLoaded.off(loaded);
      if (preview.isReadyForPlayback) start();
      else preview.playerReady.on(function ready() { preview.playerReady.off(ready); start(); });
    });
    preview.tex(`${header}\\ts (${ts.timeSignatureNumerator} ${ts.timeSignatureDenominator}) ${raw}`);
  });
  preview.playerStateChanged.on(e => { $('play').textContent = e.state === 1 ? 'Stop' : 'Play bar'; });
  load();
</script>
