<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Local bar editor: full tab on top, a fixed panel at the bottom with the selected bar as a string x sixteenth grid */
  :root {
    --bg: #eef0ec; --fg: #1c221f; --muted: #5b6660; --line: #cfd6d0; --accent: #2e6a58; --paper: #fff; --bad: #b3261e;
    --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); }
  header { padding: 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .hint { color: var(--muted); }
  .sheet { background: var(--paper); margin: 0 16px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); overflow-x: auto; }
  #tab { min-width: 760px; }
  #tab .at-cursor-bar { background: rgb(46 106 88 / .12); }
</style>

<header>
  <h1 id="title">Tab editor</h1>
  <span class="hint">Click a bar to edit it.</span>
</header>
<div class="sheet"><div id="tab"></div></div>

<script>window.GT_ASSETS = { base: '../' };</script>
<script src="../vendor/alphatab/alphaTab.min.js"></script>
<script src="../web/playback.js"></script>
<script src="../web/editor.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('song');
  const api = GT.newApi(document.getElementById('tab'), {
    display: { staveProfile: 'Tab', barsPerRow: innerWidth < 900 ? 2 : 3, justifyLastSystem: true, systemPaddingBottom: 40 },
    notation: { elements: { scoreTitle: false, scoreArtist: false, guitarTuning: false, trackNames: false, effectDynamics: false, effectTempo: false, effectCapo: false, effectLetRing: false, chordDiagrams: false, effectChordNames: false } },
  });
  let header = '';
  let song = { bars: [] };
  const editor = GT.mountEditor(api, {
    header: () => header,
    ringBeats: () => song.ring ?? 1,
    letRingBars: () => song.bars.flatMap((b, i) => (b.letRing ? [i] : [])),
    saveLabel: 'Save &amp; rebuild',
    onSave: (index, raw) => change('PUT', index, { raw }),
    onReset: index => change('DELETE', index),
    soundMenu: true,
  });

  async function load() {
    if (!slug) return editor.status('Add ?song=<folder> to the URL.', true);
    const tex = await (await fetch(`../${slug}/song.tex`, { cache: 'no-store' })).text();
    header = tex.slice(0, tex.indexOf('\\ts'));
    song = (await import(`../${slug}/song.mjs?v=${Date.now()}`)).default;
    document.getElementById('title').textContent = song.title;
    api.tex(tex);
  }

  // edit.mjs writes the bar into song.mjs and rebuilds the song.
  async function change(method, index, body) {
    editor.status('Rebuilding…');
    const res = await fetch(`/api/${slug}/bars/${index}`, { method, body: body && JSON.stringify(body) });
    const text = await res.text();
    if (!res.ok) throw new Error(text || `Save failed (${res.status})`);
    await load();
    return method === 'PUT' ? 'Saved.' : 'Reset to the song pattern.';
  }
  load();
</script>
